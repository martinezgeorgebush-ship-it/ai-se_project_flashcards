<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDeck</title>
    <meta name="author" content="Jorge Martinez" />
    <meta
      name="description"
      content="Interactive flashcards to help developers learn and remember software engineering terms"
    />
    <meta
      name="keywords"
      content="learning material, study aids, flashcards, learning materials"
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/index.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">flashcards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My Decks</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <ul class="gallery__list">
          <template id="deck-template">
            <li class="card card_color_green">
              <a href="#" class="card__link"></a>
              <h2 class="card__title"></h2>
              <div class="card__row">
                <p class="card__count"></p>
                <button
                  class="card__btn card__btn_type_delete"
                  type="button"
                  aria-label="Delete this card"
                >
                  <img src="assets/images/delete.svg" alt="delete" />
                </button>
              </div>
            </li>
          </template>
        </ul>
        <button class="gallery__new-card-btn">+ New Deck</button>
      </section>

      <section id="deck-view" class="gallery" style="display: none">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>
        <ul class="gallery__list">
          <template id="card-template">
            <li class="card card_color_green">
              <h2 class="card__title"></h2>
              <div class="card__row">
                <button
                  class="card__btn card__btn_type_flip"
                  type="button"
                  aria-label="Flip card"
                >
                  <img src="assets/images/flip.svg" alt="flip" />
                </button>
                <button
                  class="card__btn card__btn_type_delete"
                  type="button"
                  aria-label="Delete this card"
                >
                  <img src="assets/images/delete.svg" alt="delete" />
                </button>
              </div>
            </li>
          </template>
        </ul>
        <button
          class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
        >
          + New Card
        </button>
      </section>

      <section id="not-found" class="not-found" style="display: none">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
      <section id="carousel" class="carousel" style="display: none">
        <h2 class="carousel__title"></h2>
        <div class="carousel__card">
          <p class="carousel__card-text"></p>
        </div>
        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="Previous card"
          >
            <img src="assets/images/left.svg" alt="Previous" />
          </button>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next Card"
          >
            <img src="assets/images/right.svg" alt="Next" />
          </button>
          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip card"
          >
            <img src="assets/images/flip.svg" alt="flip" />
          </button>
        </div>
      </section>
    </main>
    <div class="modal" id="confirmation-modal" style="display: none">
      <div class="modal__content">
        <p class="modal__text">Are you sure you want to delete this?</p>
        <div class="modal__buttons">
          <button class="modal__btn modal__btn_type_confirm" type="button">
            Yes, delete
          </button>
          <button class="modal__btn modal__btn_type_cancel" type="button">
            Cancel
          </button>
        </div>
      </div>
    </div>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Jorge Martinez</p>
    </footer>
    <script type="module" src="assets/js/index.js"></script>
  </body>
</html>
